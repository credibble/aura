name: CI

# Every gate the session established, run on push: the app's static checks, the
# oracle's unit + black-box API tests, the contract suite (including the money
# invariants) and the indexer's config + schema codegen.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  app:
    name: app · types + contract/write checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # app/ is a standalone npm project (its own lockfile), not a workspace of
      # the root package, so it must be installed in-place — a root `npm ci`
      # leaves app/node_modules empty and every react import unresolved.
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Every contract write encodes (ABI + arity)
        run: node scripts/check-writes.mjs
      - name: App queries vs the indexer schema
        run: node scripts/check-indexer-fields.mjs
      # check-routes.mjs needs the dev server plus a live indexer; run it where
      # those services exist (it is a no-op failure otherwise). Enable with:
      #   RUN_ROUTE_SMOKE=1 and an INDEXER_URL secret.

  oracle:
    name: oracle · types + unit + API e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The oracle imports @aura/contracts types, which resolve to
      # packages/contracts/dist (gitignored, no postinstall build) — build it
      # first or every `from "@aura/contracts"` is TS2307.
      - name: Build shared contracts
        run: npm run build:contracts
      # @prisma/client ships ungenerated; without this Prisma.DbNull and the
      # query return types are missing, so the client types are unusable.
      - name: Generate Prisma client
        run: npm run prisma:generate -w @aura/oracle
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: oracle
      - name: Unit suite
        run: npm test
        working-directory: oracle
      - name: API e2e (builds and spawns dist/main.js)
        run: npm run test:e2e
        working-directory: oracle
        env:
          # No database or Redis required: the suite asserts the degraded-but-up
          # contract (DB_REQUIRED=false, JOBS_ENABLED=false).
          JOBS_ENABLED: "false"
          DB_REQUIRED: "false"

  contracts:
    name: contracts · compile + tests (money invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  indexer:
    name: indexer · config + schema codegen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Validates config.yaml + schema.graphql and regenerates the handler types
      # from them. The Envio CLI addon is linux/darwin only, which is why this
      # gate has to run here (or under WSL) rather than on a Windows machine.
      - run: npx envio codegen
