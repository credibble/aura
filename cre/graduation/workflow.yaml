# CRE workflow config �?" per-target settings for the Aura handle-graduation
# workflow. The workflow code lives in ./main.ts; params (schedule, subgraph
# endpoint, aura floor) are injected from the target's config JSON at runtime
# via `runtime.config`.

staging-settings:
  user-workflow:
    workflow-name: "aura-graduation-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "./secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "aura-graduation-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "./secrets.yaml"