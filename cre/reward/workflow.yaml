# CRE workflow config — the Aura stake-reward workflow on Monad testnet.
# The workflow code lives in ./main.ts; params (schedule, the Envio indexer
# endpoint, addresses, amount) are injected from config.json at runtime via
# `runtime.config`. There is one target (`testnet-settings`) — the whole
# protocol lives on Monad testnet, there is no mainnet/production deploy.

testnet-settings:
  user-workflow:
    workflow-name: "aura-stake-reward-testnet"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: "./secrets.yaml"
