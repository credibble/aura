# CRE workflow config — per-target settings for the Aura stake-gifting workflow.
# The workflow code lives in ./main.ts; params (schedule, addresses, amount) are
# injected from the target's config JSON at runtime via `runtime.config`.

staging-settings:
  user-workflow:
    workflow-name: "aura-stake-gift-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "./secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "aura-stake-gift-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "./secrets.yaml"