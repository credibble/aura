# Aura — HyperIndex (Envio) indexer.
#
# Every piece of on-chain state the app and the oracle read: handles, windows,
# trades, price points, orders + fills, the auraLP vault and staking. Replaces
# the old graph-node indexer; the flaky public-RPC + graph-node pair is gone.
#
# Dynamic contracts (Handle, Stake) are registered by the factory's
# `HandleCreated` through `indexer.contractRegister` — they carry no address.
#
# Addresses are synced from ../smart-contracts/deployments/deployments.json by
# `node smart-contracts/scripts/sync-indexer.mjs --write` (run by deploy-all.mjs).
#
# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: aura-indexer
description: Aura — the internet aura market (handles, windows, trades, orders, auraLP vault, staking)

# Handlers key Trade/PricePoint/PoolSnapshot rows by transaction hash, and read
# block timestamps on every event. Both are opt-in field selections; ask once.
field_selection:
  transaction_fields:
    - hash

chains:
  - id: 10143 # Monad testnet
    start_block: 66989549
    rpc:
      # HyperSync is the primary source for this chain (ENVIO_API_TOKEN, or the
      # token Envio Cloud provides). This RPC is the resilience path — and the
      # only RPC the handlers' historical reads would use, though there are none:
      # the contracts emit everything. Point it at a tokenized HyperRPC endpoint
      # via ENVIO_RPC_URL; the public node is the non-secret default so the config
      # always resolves (Envio Cloud, a laptop, CI).
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: fallback
    contracts:
      - name: Configurator
        address: "0x1F344fcf94f274CB8D718DEE10B97A80157674b5"
        events:
          - event: "DepositFeeRangeSet(uint64 minBps, uint64 maxBps)"
          - event: "MaxFeeAuraSet(uint256 maxFeeAura)"
          - event: "MarketFeeBpsSet(uint64 bps)"
          - event: "MinWindowSecondsSet(uint256 minWindowSeconds)"
          - event: "WindowPaddingSet(uint256 windowPadding)"
      - name: MarketRegistry
        address: "0x499dEf97B668F5fDd748781E598061dFA6290a70"
        events:
          - event: "HandleRegistered(bytes32 indexed handleId, uint256 windowMinutes)"
      - name: OracleFactory
        address: "0x39462B4b2D5Ba400d4faD293F54FeD5904b61956"
        events:
          - event: "OracleDeployed(bytes32 indexed handleId, uint256 windowStart, address oracle)"
      - name: HandleFactory
        address: "0x5A4F966dCc5F858039E0cFD773056f184376496c"
        events:
          - event: "HandleCreated(bytes32 indexed handleId, address indexed handle, address indexed stake, address creator, address market, address oracleFactory, address revenue, string name, string symbol, string metadata, uint256 windowMinutes, uint256[] categories)"
      - name: Pool
        address: "0x6c6f0F5cBb510f78E2cd96f48D4166201F73dC6F"
        events:
          - event: "Reserved(address indexed oracle, uint256 amount)"
          - event: "PaidOut(address indexed oracle, address indexed to, uint256 amount)"
          - event: "Unreserved(address indexed oracle, uint256 amount)"
          - event: "PoolStateChanged(uint256 totalAssets, uint256 totalSupply, uint256 idle, uint256 totalReserved)"
      - name: RevenueSharing
        address: "0x808b3c64F496c365B173739F8c124de4f23a019e"
        events:
          - event: "FeeSplit(bytes32 indexed handleId, uint256 amount, uint256 user, uint256 lp, uint256 protocol)"
      - name: MarketMaker
        address: "0x6b3d9D88Ec43b04F42e2F872073036c9ce6A4Dee"
        events:
          - event: "WindowOpened(bytes32 indexed handleId, address indexed oracle, uint256 windowStart, uint256 windowEnd, string[] outcomes, uint256[] probabilities, uint256 funding, string oracleMetadata)"
          - event: "PricesUpdated(bytes32 indexed handleId, address indexed oracle, uint256[] prices)"
          - event: "Bought(bytes32 indexed handleId, address indexed oracle, address indexed trader, uint256 outcome, uint256 amountIn, uint256 sharesMinted, uint256 price)"
          - event: "Sold(bytes32 indexed handleId, address indexed oracle, address indexed trader, uint256 outcome, uint256 sharesBurned, uint256 proceeds)"
          - event: "Settled(bytes32 indexed handleId, address indexed oracle, uint256 winningOutcome)"
          - event: "Claimed(bytes32 indexed handleId, address indexed oracle, address indexed trader, uint256 outcome, uint256 sharesBurned, uint256 payout)"
          - event: "VoidRedeemed(bytes32 indexed handleId, address indexed oracle, address indexed trader, uint256 payout)"
          - event: "Transferred(address indexed from, address indexed to, address indexed oracle, uint256 outcome, uint256 amount)"
      - name: OrderBook
        address: "0x0205f9fFC20d51CdB36c22E0D6dC901E6B9165e7"
        events:
          - event: "OrderPlaced(bytes32 indexed handleId, address indexed oracle, uint256 outcome, bool side, address indexed maker, bytes32 id, uint256 price, uint256 size, uint256 expiresAt)"
          - event: "OrderCancelled(bytes32 indexed handleId, address indexed oracle, bytes32 id)"
          - event: "OrderUpdated(bytes32 indexed handleId, address indexed oracle, bytes32 id, uint256 price, uint256 size, uint256 expiresAt)"
          - event: "OrderFilled(bytes32 indexed handleId, address indexed oracle, bytes32 id, address indexed taker, uint256 outcome, uint256 shares, uint256 price)"
      # Deployed per handle by HandleFactory.HandleCreated. No address: the
      # factory registers each one through indexer.contractRegister.
      - name: Handle
        events:
          - event: "SourcesChanged(string[] sources)"
          - event: "AuraUpdated(uint256 aura, string summary)"
          - event: "CategoriesSet(uint256[] categories)"
          - event: "GraduatedSet(bool graduated)"
          - event: "VerifiedSet(bool verified)"
          - event: "MetadataSet(string metadata)"
          - event: "WindowMinutesSet(uint256 windowMinutes)"
          - event: "OwnershipTransferStarted(address indexed previousOwner, address indexed newOwner)"
          - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      # Deployed per handle by HandleFactory.HandleCreated, tracked for the
      # receipt's state snapshots.
      - name: Stake
        events:
          - event: "StakeStateChanged(uint256 totalSupply, uint256 totalAssets, uint256 valuePerToken)"

# Addresses come out lowercase (matching the app's lowercased wallet filters and
# the ids graph-node used to produce), and bytes stay hex strings.
address_format: lowercase

