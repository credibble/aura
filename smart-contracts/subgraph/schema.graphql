"""A registered handle (market) — e.g. @btc, @ai. Top-level on-chain entity:
the Handle contract bundles the creator, metadata, the pricing market, and the
per-handle Stake receipt; the Pool is the singleton auraLP vault shared by all
handles."""
type Handle @entity {
  id: ID! # handleId bytes32 hex
  contract: Bytes! # Handle contract address
  owner: User! # the owner (account) — every handle has one
  name: String
  symbol: String
  metadata: String
  market: Bytes! # the MarketMaker
  oracleFactory: Bytes! # resolves the handle's windows
  revenue: Bytes! # the reward distributor
  stake: Bytes! # per-handle AURA Stake receipt
  sources: [String!]! # adapter source JSON configs (platform adapters parse them)
  aura: BigInt! # the handle's live Aura score (1e2) - drives the Stake fee curve
  auraDelta: BigInt! # signed change of the latest AuraUpdated push (1e2)
  graduated: Boolean! # trading-prediction graduation (backend-granted)
  category: BigInt! # market-style category code (e.g. 100_001_001 = sport/football/binary)
  """Family id derived from the code (`crypto` | `ai` | `sports` | `people` |
  `brands` | `memes` | `music` | `tech` | `culture`) — lets the index filter by
  category at the API level, which the numeric code's family prefix can't do."""
  categoryId: String!
  verified: Boolean! # verification status (backend-granted)
  pendingOwner: Bytes! # OZ Ownable2Step two-step transfer target (0 = none)
  windowMinutes: BigInt!
  active: Boolean!
  windows: [Window!]! @derivedFrom(field: "handle")
  stakeReceipt: Stake @derivedFrom(field: "handle")
  auraHistory: [AuraHistory!]! @derivedFrom(field: "handle")
  windowCount: Int!
}

"""
One prediction window on the MarketMaker: binary YES/NO against an EMA-baseline
strike, OR a winner-takes-all categorical market (who gains the most Aura?).
Priced by an LMSR AMM — each outcome's price is its probability, all sum to 1.
The winning outcome (argmax of the settled final indices) pays 1 USDC per share.
"""
type Window @entity {
  id: ID! # `${handleId}-${windowStart}`
  handle: Handle!
  oracle: Bytes! # per-window Oracle (identity/signer)
  oracleMetadata: String! # raw oracle metadata JSON (windowMetadata output)
  question: String! # parsed from oracleMetadata — the market's question
  style: String! # parsed from oracleMetadata — "binary" | "multi"
  handleId: Bytes!
  windowStart: BigInt!
  windowEnd: BigInt!
  outcomes: [String!]! # outcome names, e.g. ["YES","NO"] or team names
  initialProbabilities: [BigInt!]! # 1e18-seeded LMSR prices at open (Σ = 1e18)
  prices: [BigInt!]! # live LMSR prices (1e18, Σ ≈ 1e18) — seeded at open, maintained per trade
  liquidity: BigInt! # LMSR depth b = funding/ln(n), 1e18
  q: [BigInt!]! # outstanding shares per outcome (1e18)
  reference: BigInt! # live index S_t, 1e2
  timestamp: BigInt!
  cash: BigInt!
  settled: Boolean!
  winningOutcome: Int
  reserved: BigInt! # PLP capacity reserved for this window (from the Pool)
  paidOut: BigInt! # USDC paid from the PLP reserve to winners/cash-outs
  volume: BigInt! # cumulative buy premium (USDC 1e18) — O(1) funding source
  trades: [Trade!]! @derivedFrom(field: "window")
  pricePoints: [PricePoint!]! @derivedFrom(field: "window")
}

"""Full LMSR price vector (1e18 per outcome) captured at every trade — the
frontend's real price-history chart source (one point per state change)."""
type PricePoint @entity {
  id: ID! # `${txnHash}-${logIndex}` (same event as the Trade)
  window: Window!
  ts: BigInt!
  prices: [BigInt!]! # Σ ≈ 1e18
}

"""One reservation movement on the singleton PLP vault — keyed by the window
oracle (the canonical window identity)."""
type PoolEvent @entity {
  id: ID! # `${oracle}-${txnHash}-${logIndex}`
  pool: Bytes!
  oracle: Bytes!
  kind: PoolEventKind! # RESERVED | PAID_OUT | UNRESERVED
  amount: BigInt!
  to: Bytes
  timestamp: BigInt!
}

enum PoolEventKind {
  RESERVED
  PAID_OUT
  UNRESERVED
}

"""Historical pool snapshot (reserve/idle/supply/price) — taken on every pool
event so the frontend renders the auraLP vault's charts over time."""
type PoolSnapshot @entity {
  id: ID! # `${pool}-${blockNumber}-${logIndex}`
  pool: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  totalReserved: BigInt!
  idle: BigInt!
  totalSupply: BigInt!
  totalAssets: BigInt!
  valuePerToken: BigInt!
}

"""Protocol configuration (Configurator singleton) — the tunables the owner
updates; kept in the index for the frontend's fee/market display."""
type Config @entity {
  id: ID! # "config"
  depositFeeMinBps: Int!
  depositFeeMaxBps: Int!
  maxFeeAura: BigInt!
  marketFeeBps: Int!
  minWindowSeconds: BigInt!
  windowPadding: BigInt!
}

"""One RevenueSharing fee split — every fee deposit's distribution to the
handle's creator (user), LP vault and protocol treasury."""
type FeeSplit @entity {
  id: ID! # tx-log
  handle: Handle!
  amount: BigInt!
  user: BigInt!
  lp: BigInt!
  protocol: BigInt!
  ts: BigInt!
}

"""A handle's Stake receipt vault (AURA LP) — current supply/assets/share-price
plus its historical snapshots."""
type Stake @entity {
  id: ID! # stake contract address
  contract: Bytes!
  handle: Handle!
  totalSupply: BigInt!
  totalAssets: BigInt!
  valuePerToken: BigInt!
  snapshots: [StakeSnapshot!]! @derivedFrom(field: "stake")
}

"""Historical stake snapshot — taken on every deposit/withdraw/reward for the
handle's AURA staking charts."""
type StakeSnapshot @entity {
  id: ID! # `${stake}-${blockNumber}-${logIndex}`
  stake: Stake!
  blockNumber: BigInt!
  timestamp: BigInt!
  totalSupply: BigInt!
  totalAssets: BigInt!
  valuePerToken: BigInt!
}

"""One aura update — the historical aura chart. Every updateAura push records
the new level (1e2) + the AI's one-line summary."""
type AuraHistory @entity {
  id: ID! # `${handleId}-${blockNumber}-${logIndex}`
  handle: Handle!
  aura: BigInt!
  delta: BigInt! # aura − previous aura at this push (1e2)
  summary: String
  blockNumber: BigInt!
  timestamp: BigInt!
}

"""Protocol-wide counters — one entity the frontend reads instead of scanning
every handle/window to derive totals."""
type Stats @entity {
  id: ID! # "stats"
  handleCount: Int!
  windowCount: Int!
  openWindows: Int!
  totalVolume: BigInt! # cumulative BUY premium (USDC 1e18)
  totalCash: BigInt! # USDC locked in unsettled windows — TVL (1e18)
}

"""Maps a window oracle address to its Window (events log the oracle)."""
type OracleWindow @entity {
  id: ID! # oracle address hex
  window: Window!
}

"""Maps a Handle contract address back to its handleId — lets event-driven
handlers (SourcesChanged) update the right Handle.""" 
type HandleAddress @entity {
  id: ID! # Handle contract address hex
  handleId: Bytes!
}

type User @entity {
  id: ID! # address hex - one entity per account (owns handles + trades)
  handleCount: Int!
  handles: [Handle!]! @derivedFrom(field: "owner")
  totalPremium: BigInt!
  totalProceeds: BigInt!
  trades: [Trade!]! @derivedFrom(field: "user")
}

"""A buy / live sell / settled claim on a window. `kind` also carries
TRANSFER_OUT / TRANSFER_IN for share movements (order-book fills), so position
math that sums trades stays correct."""
type Trade @entity {
  id: ID! # tx-log
  window: Window!
  user: User!
  outcome: Int! # the outcome index traded (0 = YES)
  kind: String! # BUY | SELL | CLAIM | TRANSFER_OUT | TRANSFER_IN
  premium: BigInt! # collateral in (buy)
  proceeds: BigInt! # collateral out (sell/claim)
  shares: BigInt!
  price: BigInt! # LMSR probability at the trade
  ts: BigInt!
}

"""A movement of outcome shares between accounts (order-book fill, direct
transfer) — the audit trail behind the two Trade rows it emits."""
type ShareTransfer @entity {
  id: ID! # tx-log
  window: Window!
  from: User!
  to: User!
  outcome: Int!
  amount: BigInt!
  ts: BigInt!
}

"""A resting limit order on the MarketMaker order book (off-chain routed)."""
type Order @entity {
  id: ID! # order id bytes32 as hex
  window: Window!
  maker: User!
  outcome: Int! # the outcome index (0 = YES)
  side: Boolean! # true = buy, false = sell
  price: BigInt! # 1e18 = 1 USDC per share
  size: BigInt!
  filled: BigInt!
  expiresAt: BigInt!
  status: String! # ACTIVE | FILLED | CANCELLED
  createdAt: BigInt!
}

"""A taker execution against a resting order."""
type OrderFill @entity {
  id: ID! # tx-log
  order: Order!
  window: Window!
  taker: User!
  outcome: Int!
  shares: BigInt!
  price: BigInt!
  ts: BigInt!
}