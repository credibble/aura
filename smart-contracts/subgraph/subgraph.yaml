# Aura IndexMarket subgraph manifest.
#
# LMSR prediction markets over the aura index: each window gets its own Oracle
# (deployed by the OracleFactory); events key windows via the oracle address.
#
# Addresses + startBlocks are synced from ../deployments/deployments.json
# (written by scripts/deploy.ts). Network: monad-testnet.
# Run `npm run codegen && npm run build`, then create:local + deploy:local.
specVersion: 1.2.0
description: Aura IndexMarket — LMSR prediction markets over the aura index
repository: https://github.com/anomalyco/aura
schema:
  file: ./schema.graphql

templates:
  - kind: ethereum/contract
    name: Handle
    network: monad-testnet
    source:
      abi: Handle
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Handle
        - AuraHistory
      abis:
        - name: Handle
          file: ./abis/Handle.json
      eventHandlers:
        - event: SourcesChanged(string[])
          handler: handleSourcesChanged
        - event: AuraUpdated(uint256,string)
          handler: handleAuraUpdated
        - event: CategorySet(uint256)
          handler: handleCategorySet
        - event: GraduatedSet(bool)
          handler: handleGraduatedSet
        - event: VerifiedSet(bool)
          handler: handleVerifiedSet
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/handle.ts

  - kind: ethereum/contract
    name: Stake
    network: monad-testnet
    source:
      abi: Stake
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Stake
        - StakeSnapshot
      abis:
        - name: Stake
          file: ./abis/Stake.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
        - event: Rewarded(uint256,string)
          handler: handleRewarded
      file: ./src/stake.ts

dataSources:
  - kind: ethereum/contract
    name: HandleFactory
    network: monad-testnet
    source:
      address: "0x4d74554BC2164cef4F4f844365d200F438493fEb"
      abi: HandleFactory
      startBlock: 66807724
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Handle
        - Stake
        - Stats
        - ShareTransfer
      abis:
        - name: HandleFactory
          file: ./abis/HandleFactory.json
        - name: Handle
          file: ./abis/Handle.json
      eventHandlers:
        - event: HandleCreated(indexed bytes32,indexed address,indexed address)
          handler: handleHandleCreated
      file: ./src/handle-factory.ts

  - kind: ethereum/contract
    name: MarketRegistry
    network: monad-testnet
    source:
      address: "0x5eA7806a099E6412CB4e4833B0C86895e6F8380c"
      abi: MarketRegistry
      startBlock: 66807713
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Handle
      abis:
        - name: MarketRegistry
          file: ./abis/MarketRegistry.json
      eventHandlers:
        - event: HandleRegistered(indexed bytes32,uint256,bool)
          handler: handleHandleRegistered
      file: ./src/registry.ts

  - kind: ethereum/contract
    name: Pool
    network: monad-testnet
    source:
      address: "0xA7329a62A657dc43B73628dE60ba6B9c269dAc08"
      abi: Pool
      startBlock: 66807728
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Window
        - PoolEvent
        - PoolSnapshot
      abis:
        - name: Pool
          file: ./abis/Pool.json
      eventHandlers:
        - event: Reserved(indexed address,uint256)
          handler: handleReserved
        - event: PaidOut(indexed address,indexed address,uint256)
          handler: handlePaidOut
        - event: Unreserved(indexed address,uint256)
          handler: handleUnreserved
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
      file: ./src/pool.ts

  - kind: ethereum/contract
    name: OracleFactory
    network: monad-testnet
    source:
      address: "0x3049f74A84fa875997450F84b2367295DE7349ef"
      abi: OracleFactory
      startBlock: 66807721
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Handle
        - Window
        - OracleWindow
      abis:
        - name: OracleFactory
          file: ./abis/OracleFactory.json
        - name: Oracle
          file: ./abis/Oracle.json
      eventHandlers:
        - event: OracleDeployed(indexed bytes32,uint256,address)
          handler: handleOracleDeployed
      file: ./src/factory.ts

  - kind: ethereum/contract
    name: MarketMaker
    network: monad-testnet
    source:
      address: "0xC28B87d57a8881C73f4eA4Ff3D8F40D569e35A6A"
      abi: MarketMaker
      startBlock: 66807736
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Window
        - User
        - Trade
        - Stats
        - ShareTransfer
      abis:
        - name: MarketMaker
          file: ./abis/MarketMaker.json
      eventHandlers:
        - event: WindowOpened(indexed bytes32,indexed address,uint256,uint256,string[],uint256[],uint256)
          handler: handleWindowOpened
        - event: Bought(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleBought
        - event: Sold(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleSold
        - event: Settled(indexed bytes32,indexed address,uint256)
          handler: handleSettled
        - event: Claimed(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleClaimed
        - event: Transferred(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferred
      file: ./src/market-maker.ts

  - kind: ethereum/contract
    name: OrderBook
    network: monad-testnet
    source:
      address: "0x58088273B5CB02F86c627B4c238F5ad60A9E5fd6"
      abi: OrderBook
      startBlock: 66807739
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - OrderFill
      abis:
        - name: OrderBook
          file: ./abis/OrderBook.json
      eventHandlers:
        - event: OrderPlaced(indexed bytes32,indexed address,uint256,bool,indexed address,bytes32,uint256,uint256,uint256)
          handler: handleOrderPlaced
        - event: OrderCancelled(indexed bytes32,indexed address,bytes32)
          handler: handleOrderCancelled
        - event: OrderUpdated(indexed bytes32,indexed address,bytes32,uint256,uint256,uint256)
          handler: handleOrderUpdated
        - event: OrderFilled(indexed bytes32,indexed address,bytes32,indexed address,uint256,uint256,uint256)
          handler: handleOrderFilled
      file: ./src/order-book.ts

  - kind: ethereum/contract
    name: Configurator
    network: monad-testnet
    source:
      address: "0xbCeD7FC0E0AD47b805F80BCA3Fccf80056FaC0E2"
      abi: Configurator
      startBlock: 66807707
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Config
      abis:
        - name: Configurator
          file: ./abis/Configurator.json
      eventHandlers:
        - event: DepositFeeRangeSet(uint64,uint64)
          handler: handleDepositFeeRangeSet
        - event: MaxFeeAuraSet(uint256)
          handler: handleMaxFeeAuraSet
        - event: MarketFeeBpsSet(uint64)
          handler: handleMarketFeeBpsSet
        - event: MinWindowSecondsSet(uint256)
          handler: handleMinWindowSecondsSet
        - event: WindowPaddingSet(uint256)
          handler: handleWindowPaddingSet
      file: ./src/configurator.ts

  - kind: ethereum/contract
    name: RevenueSharing
    network: monad-testnet
    source:
      address: "0x0B332AaF4E320ECECd022e50520a85e26B90F938"
      abi: RevenueSharing
      startBlock: 66807732
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FeeSplit
        - Handle
      abis:
        - name: RevenueSharing
          file: ./abis/RevenueSharing.json
      eventHandlers:
        - event: FeeSplit(indexed bytes32,uint256,uint256,uint256,uint256)
          handler: handleFeeSplit
      file: ./src/revenue.ts



